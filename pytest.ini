# pytest.ini - Configuración de pytest

[tool:pytest]
# Directorio de tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones adicionales
addopts = 
    -v
    --strict-markers
    --tb=short

# Marcas (markers)
markers =
    unit: Tests unitarios
    integration: Tests de integración
    slow: Tests lentos
    database: Tests que requieren base de datos

# Rutas a ignorar en los tests
norecursedirs = 
    .git
    archive
    venv
    node_modules
