<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Platónico POS</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" sizes="32x32" href="/static/images/platonico_logo.jpg">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Dancing+Script&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-beige: #F2E8D5;
            --primary-wine: #7A1E2C;
            --secondary-brown: #5C3A21;
            --text-dark: #2B2B2B;
            --border-metal: #8A8F94;
            --accent-gold: #C9A66B;
            --accent-copper: #B87333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #F2E8D5;
            /* Un tono un poco más oscuro para el fondo general */
            background-image: url('https://www.transparenttextures.com/patterns/linen.png');
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor Flotante con dimensiones de Mockup (1100x850px) */
        .login-main-container {
            width: 1100px;
            height: 850px;
            background-color: var(--bg-beige);
            border-radius: 25px;
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        /* Lado Izquierdo: Imagen Gastronómica Proporcional */
        .visual-side {
            flex: 1;
            width: 50%;
            background: url('/static/images/platonico_login_bbq.png') no-repeat;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .visual-side::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.08));
        }

        /* Lado Derecho: Formulario Centrado */
        .form-side {
            flex: 1;
            width: 50%;
            background-color: var(--bg-beige);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px; /* Reducido un poco para dar más aire al formulario */
        }

        .login-box {
            width: 100%;
            max-width: 440px; /* Aumentado ~30% */
            text-align: center;
        }

        .logo-container {
            margin-bottom: 35px;
        }

        .platonic-logo {
            max-width: 250px; /* Aumentado de 180px a 250px (~40%) para impacto visual */
            height: auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        .form-label {
            font-size: 1rem; /* Aumentado de 0.75rem */
            font-weight: 700;
            color: var(--border-metal);
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.6);
            border: 2px solid var(--border-metal);
            border-radius: 12px;
            padding: 16px 22px; /* Aumentado de 14/18 */
            font-size: 1.25rem; /* Aumentado de 1rem */
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: var(--accent-copper);
            box-shadow: 0 0 0 5px rgba(184, 115, 51, 0.1);
            outline: none;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--border-metal);
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-login {
            background-color: var(--primary-wine);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 20px; /* Aumentado de 16px */
            width: 100%;
            font-weight: 700;
            font-size: 1.3rem; /* Aumentado de 1rem */
            letter-spacing: 3px;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(122, 30, 44, 0.2);
        }

        .btn-login:hover {
            background-color: #5A1621;
            transform: translateY(-1px);
            box-shadow: 0 15px 25px rgba(122, 30, 44, 0.3);
            color: white;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert {
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .copyright {
            margin-top: 40px;
            font-size: 0.75rem;
            color: var(--border-metal);
            opacity: 0.6;
        }

        /* Mobile Layout */
        @media (max-width: 850px) {
            .login-main-container {
                flex-direction: column;
                height: auto;
                max-width: 450px;
            }

            .visual-side {
                display: none;
            }

            .form-side {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-main-container">
        <!-- Visual (Izquierda): Solo Comida -->
        <div class="visual-side"></div>

        <!-- Form (Derecha): Centrado y Limpio -->
        <div class="form-side">
            <div class="login-box">
                <div class="logo-container">
                    <img src="/static/images/platonico_logo.jpg" alt="Logo Platónico" class="platonic-logo">
                </div>

                <div id="alert-container"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Tu usuario"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Tu contraseña" required>
                            <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login" id="loginBtn">
                        <span class="btn-text">LOGIN</span>
                        <div class="spinner-border spinner-border-sm d-none" id="loadingSpinner" role="status"></div>
                    </button>

                    <!-- Enlaces adicionales eliminados según solicitud -->
                </form>

                <div class="copyright">
                    © 2024 Platónico POS
                </div>
            </div>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const btnText = loginBtn.querySelector('.btn-text');
            const spinner = document.getElementById('loadingSpinner');

            btnText.classList.add('d-none');
            spinner.classList.remove('d-none');
            loginBtn.disabled = true;

            try {
                const response = await fetch('/api/v1/auth/login-json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('auth_token', data.access_token);
                    document.cookie = `auth_token=${data.access_token}; path=/; max-age=${30 * 60}; SameSite=Strict`;
                    window.location.href = '/';
                } else {
                    showAlert('danger', data.detail || 'Credenciales inválidas');
                }
            } catch (error) {
                showAlert('danger', 'Error de conexión');
            } finally {
                btnText.classList.remove('d-none');
                spinner.classList.add('d-none');
                loginBtn.disabled = false;
            }
        });

        function showAlert(type, message) {
            document.getElementById('alert-container').innerHTML = `
                <div class="alert alert-${type} fade show">${message}</div>
            `;
        }
    </script>
</body>

</html>
