{% extends "base.html" %}

{% block title %}Menú del Día - Sistema POS{% endblock %}

{% block extra_css %}
<style>
    .menu-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: all 0.3s ease;
        margin-bottom: 20px;
    }
    
    .menu-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    
    .plato-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 15px;
        border-left: 4px solid #e9ecef;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .plato-card:hover {
        border-left-color: #3b82f6;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.1);
        transform: translateY(-2px);
    }
    
    .plato-card.fijo {
        border-left-color: #10b981;
    }
    
    .plato-card.variable {
        border-left-color: #f59e0b;
    }
    
    .plato-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        margin-bottom: 10px;
    }
    
    .plato-badge.fijo {
        background-color: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
    }
    
    .plato-badge.variable {
        background-color: #fef3c7;
        color: #92400e;
        border: 1px solid #fde68a;
    }
    
    .category-section {
        background: #f8fafc;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
    }
    
    .category-title {
        color: #374151;
        font-weight: 600;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        font-size: 1.1rem;
    }
    
    .category-title i {
        margin-right: 10px;
        color: #6b7280;
        font-size: 1.2rem;
    }
    
    .price-tag {
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 1.1rem;
    }
    
    .menu-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 30px;
        text-align: center;
    }
    
    .menu-header h1 {
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 10px;
    }
    
    .menu-header p {
        font-size: 1.1rem;
        opacity: 0.9;
        margin-bottom: 0;
    }
    
    .no-menu {
        text-align: center;
        padding: 60px 20px;
        background: #f8fafc;
        border-radius: 15px;
        border: 2px dashed #d1d5db;
    }
    
    .no-menu i {
        font-size: 4rem;
        color: #9ca3af;
        margin-bottom: 20px;
    }
    
    .loading {
        text-align: center;
        padding: 40px;
    }
    
    .loading i {
        font-size: 2rem;
        color: #6b7280;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    .error-message {
        background: #fef2f2;
        color: #dc2626;
        padding: 20px;
        border-radius: 12px;
        margin: 20px 0;
        border: 1px solid #fecaca;
        text-align: center;
    }
    
    .refresh-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        color: white;
        border: none;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        transition: all 0.3s ease;
    }
    
    .refresh-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Header del Menú -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="menu-header">
                <h1>
                    <i class="bi bi-calendar-day me-3"></i>
                    Menú del Día
                </h1>
                <p>Platos disponibles para hoy</p>
            </div>
        </div>
    </div>

    <!-- Contenido del Menú -->
    <div class="row">
        <div class="col-12">
            <div id="menuContent">
                <div class="loading">
                    <i class="bi bi-hourglass-split"></i>
                    <p class="mt-3">Cargando menú del día...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Botón de actualizar -->
<button class="refresh-btn" onclick="loadTodayMenu()" title="Actualizar menú">
    <i class="bi bi-arrow-clockwise"></i>
</button>
{% endblock %}

{% block extra_js %}
<script>
// Variables globales
let todayMenu = null;

// Cargar menú al inicializar
document.addEventListener('DOMContentLoaded', function() {
    loadTodayMenu();
    
    // Actualizar automáticamente cada 5 minutos
    setInterval(loadTodayMenu, 300000);
});

// Cargar menú de hoy
async function loadTodayMenu() {
    try {
        showLoading();
        const response = await fetch('/api/v1/menus/hoy/menu');
        
        if (response.ok) {
            const data = await response.json();
            todayMenu = data;
            renderTodayMenu(data);
        } else if (response.status === 404) {
            showNoMenu();
        } else {
            showError('Error cargando el menú del día');
        }
    } catch (error) {
        console.error('Error cargando menú de hoy:', error);
        showError('Error de conexión. Verifica tu conexión a internet.');
    }
}

// Renderizar menú de hoy
function renderTodayMenu(menuData) {
    const content = document.getElementById('menuContent');
    
    if (!menuData.menu) {
        showNoMenu();
        return;
    }
    
    const menu = menuData.menu;
    const platosFijos = menuData.platos_fijos || [];
    const platosVariables = menuData.platos_variables || [];
    const platosPorCategoria = menuData.platos_por_categoria || {};
    
    let html = `
        <div class="row">
            <div class="col-12">
                <div class="menu-card">
                    <div class="card-header bg-light">
                        <h3 class="card-title mb-0">
                            <i class="bi bi-calendar-check me-2"></i>
                            ${menu.nombre || 'Menú del Día'}
                        </h3>
                        <p class="text-muted mb-0 mt-2">${menu.descripcion || 'Disfruta de nuestros platos especiales'}</p>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Platos Fijos
    if (platosFijos.length > 0) {
        html += `
            <div class="row">
                <div class="col-12">
                    <div class="category-section">
                        <h4 class="category-title">
                            <i class="bi bi-check-circle"></i>Platos Fijos
                        </h4>
                        <p class="text-muted mb-3">Estos platos se incluyen automáticamente en todos los pedidos</p>
                        <div class="row">
        `;
        
        platosFijos.forEach(plato => {
            html += `
                <div class="col-md-6 col-lg-4 mb-3">
                    <div class="plato-card fijo">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="plato-badge fijo">Fijo</span>
                            <span class="price-tag">$${plato.precio}</span>
                        </div>
                        <h5 class="mb-2">${plato.nombre}</h5>
                        <p class="text-muted mb-0">${plato.descripcion || 'Sin descripción'}</p>
                    </div>
                </div>
            `;
        });
        
        html += `
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    // Platos Variables por Categoría
    if (Object.keys(platosPorCategoria).length > 0) {
        html += `
            <div class="row">
                <div class="col-12">
                    <div class="category-section">
                        <h4 class="category-title">
                            <i class="bi bi-list-ul"></i>Platos Variables
                        </h4>
                        <p class="text-muted mb-3">Selecciona uno de cada categoría para tu pedido</p>
        `;
        
        Object.keys(platosPorCategoria).forEach(categoria => {
            const platos = platosPorCategoria[categoria];
            html += `
                <div class="mb-4">
                    <h5 class="mb-3">
                        <i class="bi bi-tag me-2"></i>${categoria}
                    </h5>
                    <div class="row">
            `;
            
            platos.forEach(plato => {
                html += `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="plato-card variable">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="plato-badge variable">Variable</span>
                                <span class="price-tag">$${plato.precio}</span>
                            </div>
                            <h5 class="mb-2">${plato.nombre}</h5>
                            <p class="text-muted mb-0">${plato.descripcion || 'Sin descripción'}</p>
                        </div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
        });
        
        html += `
                    </div>
                </div>
            </div>
        `;
    }
    
    // Si no hay platos variables organizados por categoría, mostrar todos juntos
    if (platosVariables.length > 0 && Object.keys(platosPorCategoria).length === 0) {
        html += `
            <div class="row">
                <div class="col-12">
                    <div class="category-section">
                        <h4 class="category-title">
                            <i class="bi bi-list-ul"></i>Platos Variables
                        </h4>
                        <p class="text-muted mb-3">Selecciona los platos que desees</p>
                        <div class="row">
        `;
        
        platosVariables.forEach(plato => {
            html += `
                <div class="col-md-6 col-lg-4 mb-3">
                    <div class="plato-card variable">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="plato-badge variable">Variable</span>
                            <span class="price-tag">$${plato.precio}</span>
                        </div>
                        <h5 class="mb-2">${plato.nombre}</h5>
                        <p class="text-muted mb-0">${plato.descripcion || 'Sin descripción'}</p>
                    </div>
                </div>
            `;
        });
        
        html += `
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    // Si no hay platos
    if (platosFijos.length === 0 && platosVariables.length === 0) {
        html += `
            <div class="row">
                <div class="col-12">
                    <div class="category-section">
                        <div class="text-center py-4">
                            <i class="bi bi-egg-fried display-4 text-muted"></i>
                            <p class="text-muted mt-2">No hay platos disponibles en este menú</p>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    content.innerHTML = html;
}

// Mostrar mensaje de no hay menú
function showNoMenu() {
    const content = document.getElementById('menuContent');
    content.innerHTML = `
        <div class="no-menu">
            <i class="bi bi-calendar-x"></i>
            <h3 class="mb-3">No hay menú para hoy</h3>
            <p class="text-muted mb-4">El menú del día aún no ha sido configurado.</p>
            <button class="btn btn-primary-custom" onclick="loadTodayMenu()">
                <i class="bi bi-arrow-clockwise me-2"></i>Actualizar
            </button>
        </div>
    `;
}

// Mostrar error
function showError(message) {
    const content = document.getElementById('menuContent');
    content.innerHTML = `
        <div class="error-message">
            <i class="bi bi-exclamation-triangle me-2"></i>
            ${message}
            <br>
            <button class="btn btn-outline-danger mt-3" onclick="loadTodayMenu()">
                <i class="bi bi-arrow-clockwise me-2"></i>Intentar de nuevo
            </button>
        </div>
    `;
}

// Mostrar loading
function showLoading() {
    const content = document.getElementById('menuContent');
    content.innerHTML = `
        <div class="loading">
            <i class="bi bi-hourglass-split"></i>
            <p class="mt-3">Cargando menú del día...</p>
        </div>
    `;
}

// Función para actualizar automáticamente
function autoRefresh() {
    loadTodayMenu();
}

// Actualizar cada 5 minutos
setInterval(autoRefresh, 300000);
</script>
{% endblock %}
