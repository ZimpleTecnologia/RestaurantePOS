<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos del Menú - Cocina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .order-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }
        
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        
        .order-card.pending {
            border-left-color: #ffc107;
        }
        
        .order-card.preparing {
            border-left-color: #17a2b8;
        }
        
        .order-card.ready {
            border-left-color: #28a745;
        }
        
        .order-card.served {
            border-left-color: #6c757d;
            opacity: 0.7;
        }
        
        .status-badge {
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .menu-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
        }
        
        .menu-item.fixed {
            border-left-color: #28a745;
        }
        
        .menu-item.option {
            border-left-color: #ffc107;
        }
        
        .btn-modern {
            border-radius: 25px;
            padding: 8px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .filter-tabs {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .nav-pills .nav-link {
            border-radius: 25px;
            margin-right: 10px;
            transition: all 0.3s ease;
        }
        
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .alert-custom {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .breadcrumb {
            background: transparent;
            padding: 0;
        }
        
        .breadcrumb-item + .breadcrumb-item::before {
            content: ">";
        }
        
        .order-time {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .customer-info {
            background: #e9ecef;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }
        
        .observations {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="row">
            <div class="col-12">
                <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#">
                            <i class="fas fa-utensils me-2"></i>
                            Pedidos del Menú - Cocina
                        </a>
                        <div class="navbar-nav ms-auto">
                            <span class="navbar-text me-3">
                                <i class="fas fa-user me-1"></i>
                                <span id="kitchen-user">Cocina</span>
                            </span>
                            <button class="btn btn-outline-light" onclick="goToKitchen()">
                                <i class="fas fa-arrow-left me-1"></i>
                                Volver a Cocina
                            </button>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
        
        <!-- Breadcrumb -->
        <div class="row mb-3">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/kitchen">Cocina</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Pedidos del Menú</li>
                    </ol>
                </nav>
            </div>
        </div>
        
        <!-- Filtros por Estado -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-tabs">
                    <ul class="nav nav-pills justify-content-center" id="statusTabs">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" onclick="filterOrders('Pendiente')">
                                <i class="fas fa-clock me-2"></i>Pendientes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="filterOrders('En preparación')">
                                <i class="fas fa-fire me-2"></i>En Preparación
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="filterOrders('Listo para servir')">
                                <i class="fas fa-check-circle me-2"></i>Listos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="filterOrders('Servido')">
                                <i class="fas fa-check-double me-2"></i>Servidos
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- Lista de Pedidos -->
        <div class="row">
            <div class="col-12">
                <div id="orders-container">
                    <div class="loading">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-2">Cargando pedidos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Alertas -->
    <div id="alerts-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1050;"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Variables globales
        let allOrders = [];
        let currentStatus = 'Pendiente';
        let ws = null;
        
        // Inicializar página
        document.addEventListener('DOMContentLoaded', function() {
            loadKitchenUser();
            loadOrders(currentStatus);
            connectWebSocket();
        });
        
        // Cargar información del usuario de cocina
        async function loadKitchenUser() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = '/login';
                    return;
                }
                
                const response = await fetch('/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('kitchen-user').textContent = user.full_name;
                }
            } catch (error) {
                console.error('Error cargando usuario:', error);
            }
        }
        
        // Cargar pedidos por estado
        async function loadOrders(status) {
            try {
                const response = await fetch(`/api/v1/products-new/orders/estado/${status}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                    }
                });
                
                if (response.ok) {
                    allOrders = await response.json();
                    renderOrders(allOrders);
                } else {
                    showAlert('Error cargando pedidos', 'danger');
                }
            } catch (error) {
                console.error('Error cargando pedidos:', error);
                showAlert('Error cargando pedidos', 'danger');
            }
        }
        
        // Renderizar pedidos
        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-utensils"></i>
                        <h4>No hay pedidos ${currentStatus.toLowerCase()}</h4>
                        <p>Los pedidos aparecerán aquí cuando estén disponibles</p>
                        <button class="btn btn-primary" onclick="loadOrders(currentStatus)">
                            <i class="fas fa-sync me-2"></i>
                            Actualizar
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = orders.map(order => `
                <div class="order-card ${getOrderCardClass(order.estado_cocina)}">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <h4>Pedido #${order.order_number}</h4>
                                    <p class="mb-1 order-time">
                                        <i class="fas fa-clock me-2"></i>
                                        ${new Date(order.created_at).toLocaleString('es-ES')}
                                    </p>
                                    <p class="mb-1">
                                        <i class="fas fa-table me-2"></i>
                                        Mesa: ${order.table_id || 'N/A'}
                                    </p>
                                    ${order.customer_name ? `
                                        <p class="mb-1">
                                            <i class="fas fa-user me-2"></i>
                                            Cliente: ${order.customer_name}
                                        </p>
                                    ` : ''}
                                    <span class="status-badge bg-${getStatusBadgeColor(order.estado_cocina)}">
                                        ${order.estado_cocina}
                                    </span>
                                </div>
                            </div>
                            
                            <div class="order-details">
                                <h6><i class="fas fa-list me-2"></i>Detalles del Menú:</h6>
                                ${renderOrderItems(order.items)}
                                
                                ${order.notes ? `
                                    <div class="observations">
                                        <strong><i class="fas fa-sticky-note me-2"></i>Notas del Pedido:</strong>
                                        <p class="mb-0">${order.notes}</p>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                        
                        <div class="col-md-4">
                            <div class="d-flex flex-column gap-2">
                                ${getStatusButtons(order)}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Renderizar items del pedido
        function renderOrderItems(items) {
            if (!items || items.length === 0) {
                return '<p class="text-muted">No hay items en el pedido</p>';
            }
            
            let html = '';
            
            items.forEach(item => {
                if (item.menu_id) {
                    // Item del menú
                    html += `
                        <div class="menu-item">
                            <strong>Menú del Día</strong>
                            ${item.productos_fijos && item.productos_fijos.length > 0 ? `
                                <div class="mt-2">
                                    <small class="text-success"><strong>Productos Incluidos:</strong></small>
                                    <ul class="mb-0">
                                        ${item.productos_fijos.map(producto => `<li>${producto.name}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            
                            ${item.opciones_elegidas && item.opciones_elegidas.length > 0 ? `
                                <div class="mt-2">
                                    <small class="text-warning"><strong>Opciones Elegidas:</strong></small>
                                    <ul class="mb-0">
                                        ${item.opciones_elegidas.map(opcion => `<li>${opcion.nombre}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            
                            ${item.observaciones ? `
                                <div class="mt-2">
                                    <small class="text-info"><strong>Observaciones:</strong> ${item.observaciones}</small>
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else if (item.product_id) {
                    // Producto individual
                    html += `
                        <div class="menu-item">
                            <strong>${item.product.name}</strong>
                            <span class="text-muted">x${item.quantity}</span>
                            ${item.notes ? `<div class="text-info"><small>${item.notes}</small></div>` : ''}
                        </div>
                    `;
                }
            });
            
            return html;
        }
        
        // Obtener botones según el estado
        function getStatusButtons(order) {
            const buttons = [];
            
            switch (order.estado_cocina) {
                case 'Pendiente':
                    buttons.push(`
                        <button class="btn btn-primary btn-modern" onclick="updateOrderStatus(${order.id}, 'En preparación')">
                            <i class="fas fa-play me-2"></i>Iniciar Preparación
                        </button>
                    `);
                    break;
                    
                case 'En preparación':
                    buttons.push(`
                        <button class="btn btn-success btn-modern" onclick="updateOrderStatus(${order.id}, 'Listo para servir')">
                            <i class="fas fa-check me-2"></i>Marcar como Listo
                        </button>
                    `);
                    break;
                    
                case 'Listo para servir':
                    buttons.push(`
                        <button class="btn btn-warning btn-modern" onclick="updateOrderStatus(${order.id}, 'Servido')">
                            <i class="fas fa-check-double me-2"></i>Marcar como Servido
                        </button>
                    `);
                    break;
                    
                case 'Servido':
                    buttons.push(`
                        <span class="text-muted text-center">
                            <i class="fas fa-check-circle me-2"></i>
                            Pedido Completado
                        </span>
                    `);
                    break;
            }
            
            return buttons.join('');
        }
        
        // Obtener clase CSS para la tarjeta del pedido
        function getOrderCardClass(status) {
            switch (status) {
                case 'Pendiente': return 'pending';
                case 'En preparación': return 'preparing';
                case 'Listo para servir': return 'ready';
                case 'Servido': return 'served';
                default: return '';
            }
        }
        
        // Obtener color del badge de estado
        function getStatusBadgeColor(status) {
            switch (status) {
                case 'Pendiente': return 'warning';
                case 'En preparación': return 'info';
                case 'Listo para servir': return 'success';
                case 'Servido': return 'secondary';
                default: return 'secondary';
            }
        }
        
        // Filtrar pedidos por estado
        function filterOrders(status) {
            currentStatus = status;
            
            // Actualizar tabs activos
            document.querySelectorAll('#statusTabs .nav-link').forEach(link => {
                link.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadOrders(status);
        }
        
        // Actualizar estado del pedido
        async function updateOrderStatus(orderId, newStatus) {
            try {
                const response = await fetch(`/api/v1/products-new/orders/${orderId}/estado`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                    },
                    body: JSON.stringify({
                        estado_cocina: newStatus
                    })
                });
                
                if (response.ok) {
                    showAlert(`Pedido actualizado a: ${newStatus}`, 'success');
                    loadOrders(currentStatus);
                } else {
                    showAlert('Error actualizando pedido', 'danger');
                }
            } catch (error) {
                console.error('Error actualizando pedido:', error);
                showAlert('Error actualizando pedido', 'danger');
            }
        }
        
        // Conectar WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/v1/ws`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                console.log('WebSocket conectado');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'new_order') {
                    showAlert('Nuevo pedido recibido', 'info');
                    loadOrders(currentStatus);
                } else if (data.type === 'order_status_change') {
                    showAlert('Estado de pedido actualizado', 'info');
                    loadOrders(currentStatus);
                }
            };
            
            ws.onclose = function() {
                console.log('WebSocket desconectado, reconectando...');
                setTimeout(connectWebSocket, 5000);
            };
            
            ws.onerror = function(error) {
                console.error('Error en WebSocket:', error);
            };
        }
        
        // Mostrar alerta
        function showAlert(message, type) {
            const alertsContainer = document.getElementById('alerts-container');
            const alertId = 'alert-' + Date.now();
            
            const alert = document.createElement('div');
            alert.id = alertId;
            alert.className = `alert alert-${type} alert-dismissible fade show alert-custom`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            alertsContainer.appendChild(alert);
            
            // Auto-remover después de 5 segundos
            setTimeout(() => {
                const alertElement = document.getElementById(alertId);
                if (alertElement) {
                    alertElement.remove();
                }
            }, 5000);
        }
        
        // Volver a cocina
        function goToKitchen() {
            window.location.href = '/kitchen';
        }
        
        // Limpiar WebSocket al cerrar la página
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
